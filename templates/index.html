<form action="/predict" method="post" id="flat-details">
    <h1>Select your flat details</h1>

    <label for="area">Area:</label>
    <input
        type="number"
        id="area"
        name="area"
        placeholder="Enter area in sq. ft."
        required
        min="1"
    >
    <br>

    <label for="facing">Facing:</label>
    <select id="facing" name="facing" required>
        <option value="">Select Facing</option>
        <option value="East">East</option>
        <option value="West">West</option>
        <option value="North">North</option>
        <option value="South">South</option>
    </select>

    <br>

    <label for="floor">Floor:</label>
    <input
        type="number"
        id="floor"
        name="floor"
        placeholder="Enter floor"
        required
        min="1"
    >
    <br>

    <label for="bedrooms">Bedrooms:</label>
    <input
        type="number"
        id="bedrooms"
        name="bedrooms"
        placeholder="Enter bedrooms"
        required
        min="1"
    >
    <br>

    <label for="car_parking">Car Parking:</label>
    <input
        type="number"
        id="car_parking"
        name="car_parking"
        placeholder="Enter car parking"
        required
        min="0"
    >
    <br>

    <button type="submit" id="predict-price">
        Predict Price
    </button>

    <br>

    <div class="output-group">
        <label for="output">Predicted Price:</label>

        <input
            type="text"
            id="output"
            placeholder="Your predicted price will appear here"
            readonly
        >
    </div>
</form>

<script>
    const form = document.getElementById("flat-details");
    const output = document.getElementById("output");

    form.addEventListener("submit", async function(event) {

        // Stop normal form submission
        event.preventDefault();

        output.value = "Predicting...";

        // Collect form data
        const formData = new FormData(form);

        try {

            // Send data to Flask
            const response = await fetch("/predict", {
                method: "POST",
                body: formData
            });

            // Convert Flask response to JSON
            const data = await response.json();

            if (data.prediction !== undefined) {

                // Display prediction
                output.value = "₹ " + data.prediction.toLocaleString("en-IN");

            } else {

                output.value = "Prediction failed";

                console.error(data.error);
            }

        } catch (error) {

            console.error(error);

            output.value = "Server error";
        }
    });
</script>
