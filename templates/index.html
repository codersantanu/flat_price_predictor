<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Venera Homes</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='styles.css') }}"
    >

</head>


<body>

    <h1 id="flat-name">
        Venera Premium Residentials
    </h1>


    <!-- ==============================
         FLAT DETAILS FORM
    =============================== -->

    <form
        action="/predict"
        method="post"
        id="flat-details"
    >

        <h1>Select your flat details</h1>


        <!-- Area -->

        <label for="area">
            Area:
        </label>

        <input
            type="number"
            id="area"
            name="area"
            placeholder="Enter area in sq. ft."
            required
            min="1"
        >

        <br>


        <!-- Facing -->

        <label for="facing">
            Facing:
        </label>

        <select
            id="facing"
            name="facing"
            required
        >

            <option value="">
                Select Facing
            </option>

            <option value="East">
                East
            </option>

            <option value="West">
                West
            </option>

            <option value="North">
                North
            </option>

            <option value="South">
                South
            </option>

        </select>

        <br>


        <!-- Floor -->

        <label for="floor">
            Floor:
        </label>

        <input
            type="number"
            id="floor"
            name="floor"
            placeholder="Enter floor"
            required
            min="1"
        >

        <br>


        <!-- Bedrooms -->

        <label for="bedrooms">
            Bedrooms:
        </label>

        <input
            type="number"
            id="bedrooms"
            name="bedrooms"
            placeholder="Enter bedrooms"
            required
            min="1"
        >

        <br>


        <!-- Car Parking -->

        <label for="car_parking">
            Car Parking:
        </label>

        <input
            type="number"
            id="car-parking"
            name="car_parking"
            placeholder="Enter car parking"
            required
            min="0"
        >

        <br>


        <!-- Predict Button -->

        <button
            type="submit"
            id="predict-price"
        >
            Predict Price
        </button>

        <br>


        <!-- Prediction Output -->

        <div class="output-group">

            <label for="output">
                Predicted Price:
            </label>

            <input
                type="text"
                id="output"
                placeholder="Your predicted price will appear here"
                readonly
            >

        </div>

    </form>


    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <script>

        const form =
            document.getElementById("flat-details");

        const output =
            document.getElementById("output");


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                output.value = "Predicting...";


                const formData =
                    new FormData(form);


                try {

                    const response =
                        await fetch("/predict", {

                            method: "POST",

                            body: formData

                        });


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.error ||
                            "Prediction failed"
                        );

                    }


                    if (
                        data.prediction !== undefined
                    ) {

                        output.value =
                            "₹ " +
                            data.prediction
                                .toLocaleString("en-IN")+" lakhs";

                    }

                    else {

                        output.value =
                            "Prediction failed";

                    }

                }

                catch (error) {

                    console.error(
                        "Error:",
                        error
                    );

                    output.value =
                        error.message;

                }

            }
        );

    </script>

</body>

</html>
